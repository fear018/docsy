name: Keep Supabase awake

# Free Supabase projects pause after 7 days without activity. Two pings a week
# keeps the demo reachable for anyone opening the link later.
on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/plans_health?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}")
          echo "status: $code"
          # 200 or 404 both prove the instance answered; only a timeout is a failure.
          if [ "$code" = "000" ]; then exit 1; fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
